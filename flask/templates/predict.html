{% extends "base.html" %}

{% block content %}
<div class="mb-4">
    <h2 class="fw-bold">Financial Prediction Model</h2>
    <p style="color: var(--text-muted);">Enter facility statistics to generate profitability metrics.</p>
</div>

{% if error %}
<div class="alert alert-danger">{{ error }}</div>
{% endif %}

<div class="modern-card">
    <form action="/supervised" method="POST" onsubmit="showLoader()">
        <div class="row g-4">
            <div class="col-md-4">
                <label class="form-label text-xs fw-bold text-uppercase" style="color: var(--text-muted);">Number of Beds</label>
                <input type="number" class="form-control" name="beds" required placeholder="e.g. 250">
            </div>
            <div class="col-md-4">
                <label class="form-label text-xs fw-bold text-uppercase" style="color: var(--text-muted);">Total Discharges</label>
                <input type="number" class="form-control" name="discharges" required placeholder="e.g. 12000">
            </div>
            <div class="col-md-4">
                <label class="form-label text-xs fw-bold text-uppercase" style="color: var(--text-muted);">FTE Employees</label>
                <input type="number" step="0.1" class="form-control" name="staff" required placeholder="e.g. 850">
            </div>

            <div class="col-md-6 mt-4">
                <label class="form-label text-xs fw-bold text-uppercase" style="color: var(--text-muted);">Total Revenue ($)</label>
                <input type="number" class="form-control" name="revenue" required placeholder="e.g. 150000000">
            </div>
            <div class="col-md-6 mt-4">
                <label class="form-label text-xs fw-bold text-uppercase" style="color: var(--text-muted);">Total Costs ($)</label>
                <input type="number" class="form-control" name="costs" required placeholder="e.g. 142000000">
            </div>

            <div class="col-md-6 mt-4">
                <label class="form-label text-xs fw-bold text-uppercase" style="color: var(--text-muted);">Geography</label>
                <select class="form-select" name="rural_urban">
                    <option value="Urban">Urban</option>
                    <option value="Rural">Rural</option>
                </select>
            </div>
            <div class="col-md-6 mt-4">
                <label class="form-label text-xs fw-bold text-uppercase" style="color: var(--text-muted);">Control Type</label>
                <select class="form-select" name="type_of_control">
                    <option value="Voluntary Nonprofit - Church">Voluntary Nonprofit - Church</option>
                    <option value="Government">Government</option>
                    <option value="Proprietary">Proprietary (For Profit)</option>
                </select>
            </div>
        </div>
        <hr class="my-5" style="border-color: #E2E8F0;">
        <button type="submit" class="btn-modern float-end"><i class="fa-solid fa-microchip me-2"></i> Run Inference</button>
        <div class="clearfix"></div>
    </form>
</div>
{% endblock %}
