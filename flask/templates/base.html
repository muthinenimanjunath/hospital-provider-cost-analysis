<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Financial Intelligence</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #f4f7fe;
            --sidebar-bg: #ffffff;
            --primary: #4318FF; 
            --secondary: #2B3674; 
            --accent: #01B574; 
            --text-muted: #A3AED0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--secondary);
            overflow-x: hidden;
        }

        /* Sidebar Styling */
        #sidebar {
            width: 280px;
            height: 100vh;
            position: fixed;
            background: var(--sidebar-bg);
            border-right: 1px solid rgba(0,0,0,0.05);
            padding: 2rem 1rem;
            z-index: 1000;
            transition: all 0.3s;
        }

        .sidebar-brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--secondary);
            margin-bottom: 3rem;
            display: flex;
            align-items: center;
            padding-left: 1rem;
            text-decoration: none;
        }

        .nav-item-custom {
            padding: 12px 20px;
            margin-bottom: 10px;
            border-radius: 12px;
            color: var(--text-muted);
            font-weight: 500;
            text-decoration: none;
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
        }

        .nav-item-custom i { margin-right: 15px; font-size: 1.2rem; }
        
        .nav-item-custom:hover, .nav-item-custom.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 10px 20px rgba(67, 24, 255, 0.2);
            transform: translateX(5px);
        }

        /* Main Content Area */
        #main-content {
            margin-left: 280px;
            padding: 2rem 3rem;
            min-height: 100vh;
            transition: all 0.3s;
        }

        /* Glass Cards */
        .modern-card {
            background: white;
            border-radius: 20px;
            border: none;
            box-shadow: 0 15px 40px rgba(112, 144, 176, 0.08);
            padding: 2rem;
            transition: transform 0.3s ease;
        }
        
        .modern-card:hover { transform: translateY(-5px); }

        /* Form Styling */
        .form-control, .form-select {
            border-radius: 12px;
            padding: 0.8rem 1rem;
            border: 1px solid #E2E8F0;
            background: #F4F7FE;
            color: var(--secondary);
            font-weight: 500;
        }
        .form-control:focus, .form-select:focus {
            box-shadow: 0 0 0 3px rgba(67, 24, 255, 0.2);
            border-color: var(--primary);
        }

        .btn-modern {
            background: var(--primary);
            color: white;
            border-radius: 12px;
            padding: 12px 24px;
            font-weight: 600;
            border: none;
            transition: all 0.3s;
        }
        .btn-modern:hover {
            background: #3311db;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(67, 24, 255, 0.3);
            color: white;
        }

        /* Loader */
        #loader {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9); z-index: 9999;
            justify-content: center; align-items: center; flex-direction: column;
        }
        .spinner { width: 50px; height: 50px; border: 5px solid #E2E8F0; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <nav id="sidebar">
        <a href="/" class="sidebar-brand">
            <i class="fa-solid fa-staff-snake" style="color: var(--primary); margin-right: 10px;"></i>
            HospitAI
        </a>
        <div class="d-flex flex-column">
            <a href="/" class="nav-item-custom"><i class="fa-solid fa-house"></i> Dashboard</a>
            
            <p class="text-xs fw-bold mt-4 mb-2 ms-3 text-uppercase" style="color: var(--text-muted); font-size: 0.8rem;">Models</p>
            <a href="/predict-form" class="nav-item-custom"><i class="fa-solid fa-chart-pie"></i> Predict Financials</a>
            <a href="/segment-form" class="nav-item-custom"><i class="fa-solid fa-network-wired"></i> Find Segment</a>
            
            <p class="text-xs fw-bold mt-4 mb-2 ms-3 text-uppercase" style="color: var(--text-muted); font-size: 0.8rem;">System</p>
            <a href="/about" class="nav-item-custom"><i class="fa-solid fa-server"></i> Methodology</a>
        </div>
    </nav>

    <div id="loader">
        <div class="spinner mb-3"></div>
        <h4 style="color: var(--secondary); font-weight: 700;">Processing ML Models...</h4>
    </div>

    <div id="main-content">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function showLoader() { document.getElementById('loader').style.display = 'flex'; }
        
        // Highlight active sidebar link
        document.addEventListener("DOMContentLoaded", function() {
            let currentPath = window.location.pathname;
            let links = document.querySelectorAll('.nav-item-custom');
            links.forEach(link => {
                if (link.getAttribute('href') === currentPath) {
                    link.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
