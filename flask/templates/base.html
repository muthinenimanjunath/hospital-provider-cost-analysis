<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hospital Performance Prediction{% endblock %}</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            color: #1f2937;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 2rem 1rem;
            overflow-y: auto;
            z-index: 1000;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
            color: white;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            transition: all 0.3s;
        }

        .nav-link:hover, .nav-link.active {
            background: rgba(255, 255, 255, 0.3);
            color: white;
        }

        .main-container {
            margin-left: 250px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .top-nav {
            background: white;
            padding: 1rem 2rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .content {
            flex: 1;
            padding: 2rem;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            margin-bottom: 1.5rem;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-left: 4px solid #2563eb;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #2563eb;
        }

        @media (max-width: 768px) {
            .sidebar { width: 200px; }
            .main-container { margin-left: 200px; }
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-hospital"></i>
            <h1>MediPredict</h1>
        </div>
        <nav>
            <a href="/" class="nav-link {% if request.endpoint == 'index' %}active{% endif %}">
                <i class="fas fa-chart-line"></i> Dashboard
            </a>
            <a href="/predict" class="nav-link {% if request.endpoint == 'predict_page' %}active{% endif %}">
                <i class="fas fa-wand-magic-sparkles"></i> Prediction
            </a>
            <a href="/analytics" class="nav-link {% if request.endpoint == 'analytics_page' %}active{% endif %}">
                <i class="fas fa-chart-bar"></i> Analytics
            </a>
            <a href="/history" class="nav-link {% if request.endpoint == 'history_page' %}active{% endif %}">
                <i class="fas fa-history"></i> History
            </a>
            <a href="/admin" class="nav-link {% if request.endpoint == 'admin_page' %}active{% endif %}">
                <i class="fas fa-cog"></i> Admin
            </a>
            <a href="/about" class="nav-link {% if request.endpoint == 'about_page' %}active{% endif %}">
                <i class="fas fa-info-circle"></i> About
            </a>
        </nav>
    </aside>

    <div class="main-container">
        <div class="top-nav">
            <h2>{% block page_title %}Dashboard{% endblock %}</h2>
        </div>
        <div class="content">
            {% block content %}{% endblock %}
        </div>
    </div>
</body>
</html>
