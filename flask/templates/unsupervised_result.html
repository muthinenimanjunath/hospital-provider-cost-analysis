{% extends "base.html" %}

{% block content %}
<div class="mb-4">
    <h2 class="fw-bold">Hospital Segmentation</h2>
    <p style="color: var(--text-muted);">Categorized via 13-Feature K-Means Matrix</p>
</div>

<div class="row justify-content-center">
    <div class="col-lg-10">
        
        <div class="modern-card mb-5 text-center py-5" style="border-top: 5px solid var(--accent);">
            <div class="mb-4">
                <i class="fa-solid fa-building-user fa-4x" style="color: var(--accent);"></i>
            </div>
            <h4 class="text-muted text-uppercase fw-bold">Assigned Archetype</h4>
            <h1 class="display-4 fw-bold mt-3" style="color: var(--secondary);">{{ r.cluster_name }}</h1>
            
            <hr class="my-4 w-75 mx-auto" style="border-color: #E2E8F0;">
            
            <div class="row mt-4">
                <div class="col-6 border-end">
                    <p class="text-muted mb-1 text-uppercase fw-bold" style="font-size: 0.8rem;">Inferred Profit Margin</p>
                    <h3 class="fw-bold text-primary">{{ r.pm_pred }}%</h3>
                </div>
                <div class="col-6">
                    <p class="text-muted mb-1 text-uppercase fw-bold" style="font-size: 0.8rem;">Inferred Charity Care</p>
                    <h3 class="fw-bold" style="color: var(--accent);">{{ r.ccr_pred }}%</h3>
                </div>
            </div>
        </div>

        <div class="text-center">
            <a href="/segment-form" class="btn btn-outline-secondary px-4 py-2" style="border-radius: 12px; font-weight: 500;">
                <i class="fa-solid fa-rotate-left me-2"></i> Run Another Clustering
            </a>
        </div>

    </div>
</div>
{% endblock %}
